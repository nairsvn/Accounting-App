<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odakkuzhal Accounts</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#647086; --line:#dde2ea;
  --accent:#1f5fa8; --accent-ink:#fff; --in:#1b7f4b; --out:#b3261e; --warn:#a15c00; --warn-bg:#fff4e0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171c; --card:#1d2128; --ink:#e6e9ef; --muted:#9aa4b5; --line:#323844;
    --accent:#6ea8ff; --accent-ink:#0b1220; --in:#5fd394; --out:#ff8a80; --warn:#ffb74d; --warn-bg:#3a2c12;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
header h1{margin:0;font-size:18px}
header .sub{color:var(--muted);font-size:12px}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px}
.card h3{margin:14px 0 6px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
.tile .k{color:var(--muted);font-size:12px}
.tile .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:6px;cursor:pointer;font:inherit}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:var(--out);background:transparent;color:var(--out)}
.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px;border-radius:6px;cursor:pointer;font:inherit}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.grp td{font-weight:600}
td.ind{padding-left:22px}
.in{color:var(--in)} .out{color:var(--out)}
.muted{color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
.ok{color:var(--in);font-weight:600} .bad{color:var(--out);font-weight:600}
.stmt-head{text-align:center;margin-bottom:8px}
.stmt-head b{font-size:16px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0}
.cols2>div{border:1px solid var(--line);padding:0}
.cols2 table td,.cols2 table th{border-bottom:none}
@media (max-width:760px){.cols2{grid-template-columns:1fr}}
.help li{margin-bottom:6px}
td.d{white-space:nowrap}
@media (max-width:600px){.vno{display:none}}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .card{border:none;padding:0}
  main{max-width:none;padding:0}
}
</style>
</head>
<body>
<header>
  <h1 id="orgName">Odakkuzhal</h1>
  <div class="sub" id="orgSub"></div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
'use strict';
/* =========================================================================
   Odakkuzhal – Treasurer's books
   Double-entry under the hood: every entry is one debit head, one credit
   head and an amount. Money is stored in paise (integers).
   Opening balances = audited Balance Sheet as on 31-03-2026.
   ========================================================================= */

const STORE_KEY = 'odakkuzhal-books-v1';
const P = r => Math.round(Number(r) * 100);           // rupees -> paise

const DEFAULT_ACCOUNTS = [
  // ---- Funds (Schedule VIII, left side)
  {id:'corpus',   name:'Trust Funds or Corpus',            type:'fund',      group:'Trust Funds',               opening:P(5165)},
  {id:'building', name:'Building Fund',                    type:'fund',      group:'Trust Funds',               opening:P(734988)},
  {id:'ie',       name:'Income & Expenditure A/c',         type:'fund',      group:'Income & Expenditure A/c',  opening:P(426080), system:true},
  // ---- Liabilities
  {id:'pay_exp',  name:'Liabilities – For Expenses (outstanding)', type:'liability', group:'Liabilities',      opening:P(6490)},
  {id:'pay_dep',  name:'Liabilities – For Deposits',       type:'liability', group:'Liabilities',               opening:P(20000)},
  // ---- Assets
  {id:'fd',       name:'FDR with NKGSB',                   type:'asset',     group:'Investments',               opening:P(803313)},
  {id:'fd_int',   name:'Accrued Interest on FDR',          type:'asset',     group:'Investments',               opening:P(16244)},
  {id:'fa_ac',    name:'Air Conditioner',                  type:'asset',     group:'Fixed Assets', depRate:10,  opening:P(11442)},
  {id:'fa_furn',  name:'Furniture & Fixtures',             type:'asset',     group:'Fixed Assets', depRate:10,  opening:P(10157)},
  {id:'fa_ht',    name:'Home Theatre',                     type:'asset',     group:'Fixed Assets', depRate:25,  opening:P(106)},
  {id:'fa_music', name:'Music Instruments',                type:'asset',     group:'Fixed Assets', depRate:10,  opening:P(751)},
  {id:'fa_prem',  name:'Premises of Office',               type:'asset',     group:'Fixed Assets', depRate:10,  opening:P(104122)},
  {id:'tds',      name:'TDS Receivables',                  type:'asset',     group:'Other Current Assets',      opening:P(5820)},
  {id:'bank',     name:'Bank Account – NKGSB',             type:'asset',     group:'Cash and Bank Balances',    opening:P(230417), system:true},
  {id:'cash',     name:'Cash in Hand',                     type:'asset',     group:'Cash and Bank Balances',    opening:P(10351),  system:true},
  // ---- Income (Schedule IX, right side)
  {id:'inc_don',   name:'Donation in Bank or Kind',                  type:'income', group:'Donations', opening:0},
  {id:'inc_fdint', name:'Interest on Fixed Deposits with NKGSB',     type:'income', group:'Interest',  opening:0},
  {id:'inc_sbint', name:'Interest on Savings Bank Account – NKGSB',  type:'income', group:'Interest',  opening:0},
  {id:'inc_itint', name:'Interest on Income Tax Refund',             type:'income', group:'Interest',  opening:0},
  // ---- Expenditure (Schedule IX, left side)
  {id:'exp_bank',     name:'Bank Charges',                type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_office',   name:'Office Expenses',             type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_elec',     name:'Electricity Charges',         type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_sainagar', name:'Sai Nagar CHS Ltd',           type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_repairs',  name:'Repairs & Maintenance',       type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_agm',      name:'Misc Expenditure (AGM)',      type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_print',    name:'Printing & Stationery',       type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_sundry',   name:'Sundry Expenses',             type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_water',    name:'Water Charges',               type:'expense', group:'Establishment Expenses', opening:0},
  {id:'exp_dep',      name:'Depreciation',                type:'expense', group:'Depreciation',           opening:0, system:true},
  {id:'exp_proj',     name:'Project Operation Expenses',  type:'expense', group:'Expenditure on Object of the Trust', opening:0},
  {id:'exp_charity',  name:'Other Charitable Objects',    type:'expense', group:'Expenditure on Object of the Trust', opening:0},
  {id:'exp_audit',    name:'Audit Fees',                  type:'expense', group:'Audit Fees',             opening:0},
];

const GROUPS = {
  fund:      ['Trust Funds'],
  liability: ['Liabilities'],
  asset:     ['Investments','Fixed Assets','Other Current Assets','Cash and Bank Balances'],
  income:    ['Donations','Interest','Other Income'],
  expense:   ['Establishment Expenses','Depreciation','Expenditure on Object of the Trust','Audit Fees','Other Expenses'],
};
const TYPE_LABEL = {fund:'Fund',liability:'Liability',asset:'Asset',income:'Income',expense:'Expenditure'};

// Audited Income & Expenditure for year ended 31-03-2026 – used as the
// "previous year" column for FY 2026-27.
const AUDITED_PY = {
  label:'31-03-2026',
  amounts:{exp_bank:531,exp_office:4540,exp_elec:2020,exp_sainagar:8200,exp_repairs:3958,exp_agm:5030,
    exp_print:2379,exp_sundry:7970,exp_water:772,exp_dep:14088,exp_proj:0,exp_charity:32250,exp_audit:6490,
    inc_don:180765,inc_fdint:58191,inc_sbint:4190,inc_itint:306},
};

function defaultState(){
  return {
    version:1,
    org:{name:'Odakkuzhal', fullName:'Odakkuzhal (Marol Malayali Samajam)',
         regNo:'F-16615 (MUMBAI) Dt.12/04/1994 (The Bombay Public Trusts Act, 1950)',
         openingDate:'2026-04-01'},
    accounts:JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS)),
    txns:[],
    lastBackup:null,
  };
}

let S;
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); S = raw ? JSON.parse(raw) : defaultState(); }
  catch(e){ S = defaultState(); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ alert('Could not save to this browser. Export a backup now so nothing is lost.'); }
}

/* ------------------------------ helpers ------------------------------ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const acc = id => S.accounts.find(a => a.id === id);
const accName = id => acc(id)?.name ?? id;
function fmt(p, blankZero){
  if (blankZero && !p) return '';
  const r = p/100;
  return r.toLocaleString('en-IN',{minimumFractionDigits: p%100 ? 2 : 0, maximumFractionDigits:2});
}
function dmy(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}-${m}-${y}`; }
function today(){ const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function fyStartYear(iso){ const [y,m] = iso.split('-').map(Number); return m >= 4 ? y : y-1; }
function fyRange(y){ return {from:`${y}-04-01`, to:`${y+1}-03-31`, label:`${y}-${String(y+1).slice(2)}`, endLabel:`31-03-${y+1}`}; }
function prevDay(iso){ const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()-1); return d.toISOString().slice(0,10); }
const baseFY = () => fyStartYear(S.org.openingDate);
function fyList(){
  const ys = new Set([baseFY(), fyStartYear(today())]);
  S.txns.forEach(t => ys.add(fyStartYear(t.date)));
  return [...ys].filter(y => y >= baseFY()).sort();
}
const debitNature = a => a.type === 'asset' || a.type === 'expense';
const isMoney = id => id === 'cash' || id === 'bank';
const sortedTxns = () => [...S.txns].sort((a,b) => a.date.localeCompare(b.date) || a.created - b.created);

/* Movement of an account between two dates (inclusive), natural sign. */
function movement(id, from, to){
  const a = acc(id); let dr = 0, cr = 0;
  for (const t of S.txns){
    if (from && t.date < from) continue;
    if (to && t.date > to) continue;
    if (t.dr === id) dr += t.amount;
    if (t.cr === id) cr += t.amount;
  }
  return {dr, cr, net: debitNature(a) ? dr - cr : cr - dr};
}
/* Surplus (income - expenditure) between two dates */
function surplus(from, to){
  let s = 0;
  for (const a of S.accounts){
    if (a.type === 'income')  s += movement(a.id, from, to).net;
    if (a.type === 'expense') s -= movement(a.id, from, to).net;
  }
  return s;
}
/* Closing balance as at a date for balance-sheet heads */
function balanceAt(id, to){
  const a = acc(id);
  if (a.type === 'income' || a.type === 'expense') return movement(id, null, to).net;
  let b = a.opening + movement(id, null, to).net;
  if (id === 'ie') b += surplus(null, to);
  return b;
}
function nextVoucher(kind, date){
  const prefix = {receipt:'R',payment:'P',contra:'C',journal:'J'}[kind];
  const y = fyStartYear(date);
  const n = 1 + S.txns.filter(t => t.kind === kind && fyStartYear(t.date) === y)
    .reduce((m,t) => Math.max(m, parseInt(String(t.vno).split('/').pop(), 10) || 0), 0);
  return `${prefix}/${fyRange(y).label}/${String(n).padStart(3,'0')}`;
}

/* ------------------------------ navigation ------------------------------ */
const VIEWS = [
  ['dash','Dashboard'],['entry','New Entry'],['txns','Transactions'],['cashbook','Cash / Bank Book'],
  ['ledger','Ledger'],['rp','Receipts & Payments'],['ie','Income & Expenditure'],['bs','Balance Sheet'],
  ['yearend','Year-end'],['settings','Heads & Backup'],['help','How to record'],
];
let view = 'dash', editingId = null, entryKind = 'receipt';
let selFY = null;
function go(v){ view = v; render(); window.scrollTo(0,0); }
function renderNav(){
  $('#nav').innerHTML = VIEWS.map(([k,l]) => `<button class="${k===view?'on':''}" onclick="go('${k}')">${l}</button>`).join('');
}
function fySelect(){
  return `<label style="max-width:160px">Financial year<select onchange="selFY=+this.value;render()">${
    fyList().map(y => `<option value="${y}" ${y===selFY?'selected':''}>FY ${fyRange(y).label}</option>`).join('')}</select></label>`;
}
function stmtHead(title, sched){
  return `<div class="stmt-head"><b>${esc(S.org.name.toUpperCase())}</b><br>
    <span class="muted">Regst No.: ${esc(S.org.regNo)}</span><br>
    ${sched ? `<span class="muted">${sched}</span><br>` : ''}<b>${title}</b></div>`;
}
function render(){
  $('#orgName').textContent = S.org.fullName;
  $('#orgSub').textContent = 'Regst No.: ' + S.org.regNo;
  if (selFY === null || !fyList().includes(selFY)) selFY = Math.max(...fyList().filter(y => y <= fyStartYear(today())), baseFY());
  renderNav();
  $('#app').innerHTML = ({dash, entry, txns, cashbook, ledger, rp, ie:ieView, bs, yearend, settings, help})[view]();
  if (view === 'entry') wireEntry();
}

/* ------------------------------ dashboard ------------------------------ */
function dash(){
  const t = today(), fy = fyRange(fyStartYear(t) < baseFY() ? baseFY() : fyStartYear(t));
  const from = fy.from < S.org.openingDate ? S.org.openingDate : fy.from;
  let rec = 0, pay = 0;
  for (const x of S.txns){
    if (x.date < from || x.date > fy.to) continue;
    if (isMoney(x.dr) && !isMoney(x.cr)) rec += x.amount;
    if (isMoney(x.cr) && !isMoney(x.dr)) pay += x.amount;
  }
  const backupDays = S.lastBackup ? Math.floor((Date.now() - S.lastBackup)/86400000) : null;
  const recent = sortedTxns().reverse().slice(0,8);
  const cash = balanceAt('cash', '9999-12-31');
  return `
  ${backupDays === null || backupDays > 14 ? `<div class="note">${backupDays === null ? 'No backup taken yet.' : `Last backup was ${backupDays} days ago.`}
    Your entries live only in this browser. <a href="#" onclick="exportJSON();return false">Download a backup now</a>.</div>` : ''}
  ${cash < 0 ? `<div class="note">Cash in hand is negative – a payment was recorded in cash that was never received in cash. Check the Cash Book.</div>` : ''}
  <div class="grid" style="margin-bottom:14px">
    <div class="tile"><div class="k">Cash in hand</div><div class="v">₹ ${fmt(cash)}</div></div>
    <div class="tile"><div class="k">Bank – NKGSB</div><div class="v">₹ ${fmt(balanceAt('bank','9999-12-31'))}</div></div>
    <div class="tile"><div class="k">FD + accrued interest</div><div class="v">₹ ${fmt(balanceAt('fd','9999-12-31')+balanceAt('fd_int','9999-12-31'))}</div></div>
    <div class="tile"><div class="k">Received (FY ${fy.label})</div><div class="v in">₹ ${fmt(rec)}</div></div>
    <div class="tile"><div class="k">Paid out (FY ${fy.label})</div><div class="v out">₹ ${fmt(pay)}</div></div>
    <div class="tile"><div class="k">Surplus so far (FY ${fy.label})</div><div class="v">₹ ${fmt(surplus(from, fy.to))}</div></div>
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between"><h2>Recent entries</h2>
      <div class="row"><button class="btn" onclick="entryKind='receipt';editingId=null;go('entry')">+ Receipt</button>
      <button class="btn" onclick="entryKind='payment';editingId=null;go('entry')">+ Payment</button></div></div>
    ${recent.length ? txnTable(recent, false) : '<p class="muted">No entries yet. Opening balances are loaded from the audited Balance Sheet as on 31-03-2026.</p>'}
  </div>`;
}

/* ------------------------------ entry form ------------------------------ */
const KINDS = [['receipt','Receipt (money in)'],['payment','Payment (money out)'],['contra','Cash ⇄ Bank'],['journal','Journal (non-cash)']];
function headOptions(types, selected, exclude=[]){
  const order = ['income','expense','fund','liability','asset'];
  return order.filter(t => types.includes(t)).map(t => {
    const list = S.accounts.filter(a => a.type === t && !exclude.includes(a.id) && a.id !== 'ie');
    if (!list.length) return '';
    return `<optgroup label="${TYPE_LABEL[t]}">${list.map(a => `<option value="${a.id}" ${a.id===selected?'selected':''}>${esc(a.name)}${a.type!=='income'&&a.type!=='expense'?'':' · '+esc(a.group)}</option>`).join('')}</optgroup>`;
  }).join('');
}
function entry(){
  const t = editingId ? S.txns.find(x => x.id === editingId) : null;
  if (t) entryKind = t.kind;
  const k = entryKind;
  const d = t ? t.date : today();
  let fields = '';
  if (k === 'receipt'){
    fields = `
      <label>Received into<select id="f_mode"><option value="cash" ${t?.dr==='cash'?'selected':''}>Cash</option><option value="bank" ${t?.dr==='bank'?'selected':''}>Bank – NKGSB</option></select></label>
      <label>Head (what is it for)<select id="f_head">${headOptions(['income','fund','liability','asset'], t?.cr ?? 'inc_don', ['cash','bank'])}</select></label>
      <label>Received from<input id="f_party" value="${esc(t?.party)}" placeholder="Name of member / donor"></label>`;
  } else if (k === 'payment'){
    fields = `
      <label>Paid from<select id="f_mode"><option value="cash" ${t?.cr==='cash'?'selected':''}>Cash</option><option value="bank" ${t?.cr==='bank'?'selected':''}>Bank – NKGSB</option></select></label>
      <label>Head (what is it for)<select id="f_head">${headOptions(['expense','asset','liability','fund'], t?.dr ?? 'exp_office', ['cash','bank'])}</select></label>
      <label>Paid to<input id="f_party" value="${esc(t?.party)}" placeholder="Vendor / person"></label>`;
  } else if (k === 'contra'){
    fields = `
      <label>Direction<select id="f_dir">
        <option value="c2b" ${t?.dr==='bank'?'selected':''}>Deposit cash into bank</option>
        <option value="b2c" ${t?.dr==='cash'?'selected':''}>Withdraw cash from bank</option></select></label>`;
  } else {
    fields = `
      <label>Debit (Dr)<select id="f_dr">${headOptions(['asset','expense','liability','fund','income'], t?.dr ?? 'fd', ['cash','bank'])}</select></label>
      <label>Credit (Cr)<select id="f_cr">${headOptions(['income','asset','liability','fund','expense'], t?.cr ?? 'inc_fdint', ['cash','bank'])}</select></label>`;
  }
  return `<div class="card">
    <h2>${t ? 'Edit entry '+esc(t.vno) : 'New entry'}</h2>
    ${t ? '' : `<div class="seg">${KINDS.map(([v,l]) => `<button class="${v===k?'on':''}" onclick="entryKind='${v}';render()">${l}</button>`).join('')}</div>`}
    ${k === 'journal' ? '<p class="muted" style="margin-top:0">Use for entries where no cash/bank moves: FD interest credited to FD, TDS deducted, depreciation, provisions for expenses, transfer between funds.</p>' : ''}
    <form id="entryForm" class="form" onsubmit="submitEntry(event)">
      <label>Date<input type="date" id="f_date" value="${d}" min="${S.org.openingDate}" required></label>
      ${fields}
      <label>Amount (₹)<input id="f_amt" type="number" step="0.01" min="0.01" inputmode="decimal" value="${t ? t.amount/100 : ''}" required></label>
      <label>Cheque / UPI / receipt ref<input id="f_ref" value="${esc(t?.ref)}"></label>
      <label style="grid-column:1/-1">Narration<input id="f_narr" value="${esc(t?.narration)}" placeholder="e.g. Onam celebration – donation"></label>
      <div class="row" style="grid-column:1/-1">
        <button class="btn" type="submit">${t ? 'Save changes' : 'Save entry'}</button>
        ${t ? `<button class="btn ghost" type="button" onclick="editingId=null;go('txns')">Cancel</button>` : ''}
        <span id="f_hint" class="muted"></span>
      </div>
    </form></div>`;
}
function wireEntry(){
  const h = $('#f_hint'), mode = $('#f_mode');
  const upd = () => { if (mode && h) h.textContent = `${mode.value === 'cash' ? 'Cash in hand' : 'Bank balance'} now: ₹ ${fmt(balanceAt(mode.value,'9999-12-31'))}`; };
  if (mode){ mode.onchange = upd; upd(); }
  $('#f_amt')?.focus();
}
function submitEntry(ev){
  ev.preventDefault();
  const date = $('#f_date').value, amount = P($('#f_amt').value);
  if (!date || !(amount > 0)) return alert('Enter a date and an amount greater than zero.');
  if (date < S.org.openingDate) return alert(`Date must be on or after ${dmy(S.org.openingDate)} (opening balance date).`);
  let dr, cr, k = entryKind;
  if (k === 'receipt'){ dr = $('#f_mode').value; cr = $('#f_head').value; }
  else if (k === 'payment'){ cr = $('#f_mode').value; dr = $('#f_head').value; }
  else if (k === 'contra'){ const c2b = $('#f_dir').value === 'c2b'; dr = c2b ? 'bank' : 'cash'; cr = c2b ? 'cash' : 'bank'; }
  else { dr = $('#f_dr').value; cr = $('#f_cr').value; }
  if (dr === cr) return alert('Debit and credit heads cannot be the same.');
  if (k === 'journal' && (isMoney(dr) || isMoney(cr))) return alert('A journal is for non-cash entries. Use Receipt, Payment or Cash ⇄ Bank when cash or bank is involved.');

  const old = editingId ? S.txns.find(x => x.id === editingId) : null;
  // Would this push cash or bank negative on any date?
  const draft = {id: old?.id ?? 'tmp', date, dr, cr, amount};
  const others = S.txns.filter(x => x.id !== draft.id).concat([draft]);
  for (const m of ['cash','bank']){
    if (cr !== m) continue;
    let bal = acc(m).opening; let low = Infinity, lowDate = '';
    for (const x of [...others].sort((a,b) => a.date.localeCompare(b.date))){
      if (x.dr === m) bal += x.amount; if (x.cr === m) bal -= x.amount;
      if (x.date >= date && bal < low){ low = bal; lowDate = x.date; }
    }
    if (low < 0 && !confirm(`${accName(m)} would go negative (₹ ${fmt(low)} on ${dmy(lowDate)}). Save anyway?`)) return;
  }
  const rec = {
    date, dr, cr, amount, kind:k,
    party: $('#f_party')?.value.trim() || '', ref: $('#f_ref').value.trim(), narration: $('#f_narr').value.trim(),
  };
  if (old){
    if (fyStartYear(old.date) !== fyStartYear(date)) rec.vno = nextVoucher(k, date);
    Object.assign(old, rec);
  } else {
    S.txns.push({id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), created: Date.now(), vno: nextVoucher(k, date), ...rec});
  }
  save();
  const wasEdit = !!old; editingId = null;
  if (wasEdit) go('txns'); else { render(); flash('Saved.'); }
}
function flash(msg){ const h = $('#f_hint'); if (h){ h.textContent = msg; h.className = 'ok'; } }

/* ------------------------------ transactions ------------------------------ */
let txFilter = {q:'', head:''};
function txnTable(list, actions){

`;

}
function txns(){
  const fy = fyRange(selFY);
  let list = sortedTxns().filter(t => t.date >= fy.from && t.date <= fy.to);

    <h2>Transactions – FY ${fy.label} <span class="muted">(${list.length})</span></h2>

function editTxn(id){ editingId = id; go('entry'); }
function delTxn(id){
  const t = S.txns.find(x => x.id === id);

/* ------------------------------ cash / bank book & ledger ------------------------------ */
let bookAcc = 'cash', ledgerAcc = 'inc_don';
function ledgerTable(id, from, to){
  const a = acc(id), nat = debitNature(a);
  const pl = a.type === 'income' || a.type === 'expense';
  const opening = pl ? 0 : balanceAt(id, prevDay(from));
  let bal = opening, tdr = 0, tcr = 0;
  const rows = sortedTxns().filter(t => t.date >= from && t.date <= to && (t.dr === id || t.cr === id)).map(t => {
    const isDr = t.dr === id, other = isDr ? t.cr : t.dr;
    if (isDr){ tdr += t.amount; bal += nat ? t.amount : -t.amount; } else { tcr += t.amount; bal += nat ? -t.amount : t.amount; }
    return `<tr><td>${dmy(t.date)}</td><td class="muted">${esc(t.vno)}</td><td>${isDr?'To':'By'} ${esc(accName(other))}${t.party?` – ${esc(t.party)}`:''}${t.narration?`<br><span class="muted">${esc(t.narration)}</span>`:''}</td>
      <td class="n">${isDr?fmt(t.amount):''}</td><td class="n">${isDr?'':fmt(t.amount)}</td><td class="n">${fmt(bal)}</td></tr>`;
  }).join('');
  const isCashBank = isMoney(id);
  const [dl, cl] = isCashBank ? ['Receipts','Payments'] : ['Debit','Credit'];
  return `<div class="tablewrap"><table><thead><tr><th>Date</th><th>Voucher</th><th>Particulars</th><th class="n">${dl}</th><th class="n">${cl}</th><th class="n">Balance</th></tr></thead><tbody>
    ${pl ? '' : `<tr class="grp"><td>${dmy(from)}</td><td></td><td>Opening balance</td><td></td><td></td><td class="n">${fmt(opening)}</td></tr>`}
    ${rows || '<tr><td colspan="6" class="muted">No entries in this period.</td></tr>'}
    <tr class="tot"><td></td><td></td><td>Totals / Closing balance</td><td class="n">${fmt(tdr)}</td><td class="n">${fmt(tcr)}</td><td class="n">${fmt(bal)}</td></tr>
  </tbody></table></div>`;
}
function periodFor(y){ const fy = fyRange(y); return {...fy, from: fy.from < S.org.openingDate ? S.org.openingDate : fy.from}; }
function cashbook(){
  const fy = periodFor(selFY);
  return `<div class="card"><div class="row noprint" style="align-items:flex-end;margin-bottom:10px">${fySelect()}
    <div class="seg" style="margin:0"><button class="${bookAcc==='cash'?'on':''}" onclick="bookAcc='cash';render()">Cash Book</button><button class="${bookAcc==='bank'?'on':''}" onclick="bookAcc='bank';render()">Bank Book – NKGSB</button></div>
    <button class="btn ghost" onclick="print()">Print</button></div>
    ${stmtHead(`${bookAcc==='cash'?'Cash Book':'Bank Book – NKGSB'} for FY ${fy.label}`)}
    ${ledgerTable(bookAcc, fy.from, fy.to)}
    ${bookAcc==='bank' ? '<p class="muted">Tick this off against the NKGSB passbook/statement every month. Bank charges and SB interest credited by the bank must be entered here too.</p>' : '<p class="muted">Count the physical cash regularly and compare with the closing balance above.</p>'}</div>`;
}
function ledger(){
  const fy = periodFor(selFY);
  return `<div class="card"><div class="row noprint" style="align-items:flex-end;margin-bottom:10px">${fySelect()}
    <label style="max-width:320px">Head<select onchange="ledgerAcc=this.value;render()">${headOptions(['income','expense','fund','liability','asset'], ledgerAcc)}<optgroup label="System"><option value="ie" ${ledgerAcc==='ie'?'selected':''}>Income & Expenditure A/c</option></optgroup></select></label>
    <button class="btn ghost" onclick="print()">Print</button></div>
    ${stmtHead(`Ledger: ${esc(accName(ledgerAcc))} – FY ${fy.label}`)}
    ${ledgerTable(ledgerAcc, fy.from, fy.to)}
    ${ledgerAcc==='ie' ? '<p class="muted">The yearly surplus is added to this account in the Balance Sheet; it does not appear as ledger lines.</p>' : ''}</div>`;
}

/* ------------------------------ Receipts & Payments ------------------------------ */
function rp(){
  const fy = periodFor(selFY);
  const rec = {}, pay = {};
  for (const t of S.txns){
    if (t.date < fy.from || t.date > fy.to) continue;
    if (isMoney(t.dr) && !isMoney(t.cr)) rec[t.cr] = (rec[t.cr]||0) + t.amount;
    if (isMoney(t.cr) && !isMoney(t.dr)) pay[t.dr] = (pay[t.dr]||0) + t.amount;
  }
  const oc = balanceAt('cash', prevDay(fy.from)), ob = balanceAt('bank', prevDay(fy.from));
  const cc = balanceAt('cash', fy.to), cb = balanceAt('bank', fy.to);
  const tr = Object.values(rec).reduce((a,b)=>a+b,0), tp = Object.values(pay).reduce((a,b)=>a+b,0);
  const lines = o => Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `<tr><td class="ind">${esc(accName(k))}</td><td class="n">${fmt(v)}</td></tr>`).join('') || '<tr><td class="ind muted">–</td><td></td></tr>';
  return `<div class="card"><div class="row noprint" style="margin-bottom:10px;align-items:flex-end">${fySelect()}<button class="btn ghost" onclick="print()">Print</button></div>
    ${stmtHead(`Receipts & Payments Account for FY ${fy.label}`)}
    <div class="cols2">
      <div><table><thead><tr><th>Receipts</th><th class="n">₹</th></tr></thead><tbody>
        <tr class="grp"><td>To Opening Balance</td><td></td></tr>
        <tr><td class="ind">Cash in Hand</td><td class="n">${fmt(oc)}</td></tr>
        <tr><td class="ind">Bank – NKGSB</td><td class="n">${fmt(ob)}</td></tr>
        <tr class="grp"><td>To Receipts</td><td></td></tr>${lines(rec)}
        <tr class="tot"><td>Total</td><td class="n">${fmt(oc+ob+tr)}</td></tr></tbody></table></div>
      <div><table><thead><tr><th>Payments</th><th class="n">₹</th></tr></thead><tbody>
        <tr class="grp"><td>By Payments</td><td></td></tr>${lines(pay)}
        <tr class="grp"><td>By Closing Balance</td><td></td></tr>
        <tr><td class="ind">Cash in Hand</td><td class="n">${fmt(cc)}</td></tr>
        <tr><td class="ind">Bank – NKGSB</td><td class="n">${fmt(cb)}</td></tr>
        <tr class="tot"><td>Total</td><td class="n">${fmt(tp+cc+cb)}</td></tr></tbody></table></div>
    </div>
    <p class="muted">Cash ⇄ Bank transfers are excluded on both sides because they move money between your own two accounts.</p></div>`;
}

/* ------------------------------ Income & Expenditure (Schedule IX) ------------------------------ */
function ieFigures(y){
  // Returns {id: rupees-paise} for income/expense heads for FY y
  if (y < baseFY()){
    if (y === baseFY()-1){ const o = {}; for (const [k,v] of Object.entries(AUDITED_PY.amounts)) o[k] = P(v); return o; }
    return null;
  }
  const fy = periodFor(y), o = {};
  for (const a of S.accounts) if (a.type === 'income' || a.type === 'expense') o[a.id] = movement(a.id, fy.from, fy.to).net;
  return o;
}
function ieView(){
  const fy = periodFor(selFY), cur = ieFigures(selFY), prev = ieFigures(selFY-1);
  const side = type => {
    const groups = [...new Set(S.accounts.filter(a => a.type === type).map(a => a.group))];
    let rows = '', tc = 0, tp = 0;
    for (const g of groups){
      const list = S.accounts.filter(a => a.type === type && a.group === g);
      const gc = list.reduce((s,a) => s + (cur[a.id]||0), 0), gp = prev ? list.reduce((s,a) => s + (prev[a.id]||0), 0) : 0;
      tc += gc; tp += gp;
      const pre = type === 'expense' ? 'To' : 'By';
      if (list.length === 1 && list[0].name === g){
        rows += `<tr class="grp"><td class="n muted">${prev?fmt(gp,true):''}</td><td>${pre} ${esc(g)}</td><td></td><td class="n">${fmt(gc,true)}</td></tr>`;
      } else {
        rows += `<tr class="grp"><td></td><td>${pre} ${esc(g)}</td><td></td><td></td></tr>`;
        list.forEach((a,i) => {
          const last = i === list.length-1;
          rows += `<tr><td class="n muted">${prev?fmt(prev[a.id]||0,true):''}</td><td class="ind">${esc(a.name)}</td><td class="n">${fmt(cur[a.id]||0,true)}</td><td class="n">${last?fmt(gc,true):''}</td></tr>`;
        });
      }
    }
    return {rows, tc, tp};
  };
  const E = side('expense'), I = side('income');
  const sc = I.tc - E.tc, sp = I.tp - E.tp;
  const prevLabel = selFY === baseFY() ? AUDITED_PY.label : fyRange(selFY-1).endLabel;
  // Surplus sits on the expenditure side, deficit on the income side – for each year independently.
  const balRow = isExp => {
    const c = isExp ? Math.max(sc,0) : Math.max(-sc,0), p = isExp ? Math.max(sp,0) : Math.max(-sp,0);
    if (!c && !p) return '';
    return `<tr class="grp"><td class="n muted">${prev?fmt(p,true):''}</td><td>${isExp?'To Surplus carried over to Balance Sheet':'By Deficit carried over to Balance Sheet'}</td><td></td><td class="n">${fmt(c,true)}</td></tr>`;
  };
  const big = Math.max(E.tc + Math.max(sc,0), I.tc + Math.max(-sc,0)), bigP = Math.max(E.tp + Math.max(sp,0), I.tp + Math.max(-sp,0));
  const head = `<thead><tr><th class="n">${prevLabel}</th><th>Particulars</th><th class="n">Amt</th><th class="n">${fy.endLabel}</th></tr></thead>`;
  return `<div class="card"><div class="row noprint" style="margin-bottom:10px;align-items:flex-end">${fySelect()}<button class="btn ghost" onclick="print()">Print</button></div>
    ${stmtHead(`Income & Expenditure Account for the year ended ${fy.endLabel}`, 'SCHEDULE - IX (Vide Rule 17(1))')}
    ${fy.to > today() ? `<div class="note noprint">Year in progress – figures to date. Depreciation, accrued FD interest and outstanding expenses are usually booked at year-end (see Year-end tab).</div>` : ''}
    <div class="cols2">
      <div><table>${head.replace('Particulars','EXPENDITURE')}<tbody>${E.rows}${balRow(true)}
        <tr class="tot"><td class="n">${prev?fmt(bigP):''}</td><td>Total Rs.</td><td></td><td class="n">${fmt(big)}</td></tr></tbody></table></div>
      <div><table>${head.replace('Particulars','INCOME')}<tbody>${I.rows}${balRow(false)}
        <tr class="tot"><td class="n">${prev?fmt(bigP):''}</td><td>Total Rs.</td><td></td><td class="n">${fmt(big)}</td></tr></tbody></table></div>
    </div></div>`;
}

/* ------------------------------ Balance Sheet (Schedule VIII) ------------------------------ */
function bs(){
  const fy = periodFor(selFY), start = prevDay(fy.from), end = fy.to;
  const prevEnd = start;
  const L = [], A = [];  // rows: [prev, label, amt, total, cls]
  let tl = 0, ta = 0, tlp = 0, tap = 0;
  // Funds
  for (const a of S.accounts.filter(a => a.type === 'fund' && a.id !== 'ie')){
    const ob = balanceAt(a.id, start), m = movement(a.id, fy.from, end), cb = ob + m.net;
    L.push([fmt(ob,true), `<b>${esc(a.name)}</b>`, '', '', 'grp']);
    L.push(['', 'Balance as per last Balance Sheet', fmt(ob), '', 'ind']);
    if (m.cr) L.push(['', 'Add: Addition during the year', fmt(m.cr), '', 'ind']);
    if (m.dr) L.push(['', 'Less: Transfers / utilisation', fmt(m.dr), '', 'ind']);
    L.push(['', '', '', fmt(cb), '']);
    tl += cb; tlp += ob;
  }
  // I&E
  const iob = balanceAt('ie', start), sur = surplus(fy.from, end), iem = movement('ie', fy.from, end), icb = iob + sur + iem.net;
  L.push([fmt(iob,true), '<b>Income & Expenditure A/c</b>', '', '', 'grp']);
  L.push(['', 'Opening Balance', fmt(iob), '', 'ind']);
  L.push(['', `${sur>=0?'Add: Surplus':'Less: Deficit'} during the year`, fmt(Math.abs(sur)), '', 'ind']);
  if (iem.net) L.push(['', 'Add/(Less): Direct adjustments', fmt(iem.net), '', 'ind']);
  L.push(['', '', '', fmt(icb), '']);
  tl += icb; tlp += iob;
  // Liabilities
  const libs = S.accounts.filter(a => a.type === 'liability');
  L.push(['', '<b>Liabilities :-</b>', '', '', 'grp']);
  let lt = 0;
  libs.forEach(a => { const p = balanceAt(a.id, prevEnd), c = balanceAt(a.id, end); lt += c; tlp += p;
    L.push([fmt(p,true), esc(a.name.replace('Liabilities – ','')), fmt(c), '', 'ind']); });
  L.push(['', '', '', fmt(lt), '']); tl += lt;

  // Assets by group
  for (const g of GROUPS.asset){
    const list = S.accounts.filter(a => a.type === 'asset' && a.group === g);
    if (!list.length) continue;
    A.push(['', `<b>${esc(g)} :-</b>`, '', '', 'grp']);
    let gt = 0;
    for (const a of list){
      const p = balanceAt(a.id, prevEnd), c = balanceAt(a.id, end); tap += p; gt += c;
      if (g === 'Fixed Assets'){
        const m = movement(a.id, fy.from, end);
        A.push([fmt(p,true), esc(a.name), fmt(p + m.dr), '', '']);
        if (m.cr) A.push(['', `Less: Depreciation${a.depRate?` @${a.depRate}%`:''}`, fmt(m.cr), '', 'ind']);
        A.push(['', '', fmt(c), '', 'ind']);
      } else {
        A.push([fmt(p,true), esc(a.name), fmt(c), '', 'ind']);
      }
    }
    A.push(['', '', '', fmt(gt), '']); ta += gt;
  }
  const cell = r => `<tr class="${r[4]==='grp'?'grp':''}"><td class="n muted">${r[0]}</td><td class="${r[4]==='ind'?'ind':''}">${r[1]}</td><td class="n">${r[2]}</td><td class="n">${r[3]}</td></tr>`;
  const head = (t) => `<thead><tr><th class="n">${fyRange(selFY-1).endLabel}</th><th>${t}</th><th class="n">Rs.</th><th class="n">${fy.endLabel}</th></tr></thead>`;
  const diff = tl - ta;
  return `<div class="card"><div class="row noprint" style="margin-bottom:10px;align-items:flex-end">${fySelect()}<button class="btn ghost" onclick="print()">Print</button></div>
    ${stmtHead(`Balance Sheet As On ${fy.endLabel.replace(/^31-03-/,'31st March, ')}`, 'SCHEDULE - VIII (Vide Rule 17(1))')}
    <div class="cols2">
      <div><table>${head('FUNDS & LIABILITIES')}<tbody>${L.map(cell).join('')}
        <tr class="tot"><td class="n">${fmt(tlp)}</td><td>Total</td><td></td><td class="n">${fmt(tl)}</td></tr></tbody></table></div>
      <div><table>${head('PROPERTY AND ASSETS')}<tbody>${A.map(cell).join('')}
        <tr class="tot"><td class="n">${fmt(tap)}</td><td>Total</td><td></td><td class="n">${fmt(ta)}</td></tr></tbody></table></div>
    </div>
    <p class="noprint">${diff === 0 ? '<span class="ok">✓ Balance Sheet tallies.</span>' : `<span class="bad">✗ Difference of ₹ ${fmt(diff)} – check opening balances in Heads & Backup.</span>`}</p></div>`;
}

/* ------------------------------ Year-end ------------------------------ */
function yearend(){
  const fy = periodFor(selFY);
  const fas = S.accounts.filter(a => a.type === 'asset' && a.group === 'Fixed Assets');
  const rows = fas.map(a => {
    const ob = balanceAt(a.id, prevDay(fy.from));
    const posted = S.txns.filter(t => t.date >= fy.from && t.date <= fy.to && t.cr === a.id && t.dr === 'exp_dep').reduce((s,t) => s + t.amount, 0);
    const adds = S.txns.filter(t => t.date >= fy.from && t.date <= fy.to && t.dr === a.id).reduce((s,t) => s + t.amount, 0);
    const sugg = Math.round(ob * (a.depRate||0) / 100 / 100) * 100;   // rate on opening WDV, rounded to rupee
    return `<tr><td>${esc(a.name)}</td><td class="n">${a.depRate??'–'}%</td><td class="n">${fmt(ob)}</td><td class="n">${fmt(adds,true)}</td><td class="n">${fmt(posted,true)}</td>
      <td class="n"><input class="dep" data-id="${a.id}" type="number" step="1" min="0" value="${posted?0:sugg/100}" style="max-width:110px;text-align:right"></td></tr>`;
  }).join('');
  return `<div class="card"><div class="row noprint" style="margin-bottom:10px;align-items:flex-end">${fySelect()}</div>
    <h2>Depreciation for FY ${fy.label}</h2>
    <p class="muted">Suggested at the rate on the opening written-down value (the method used in the audited 2025-26 accounts, e.g. AC 12,713 × 10% = 1,271).
      For assets bought during the year, ask your CA whether full or half rate applies and type the amount in.</p>
    <div class="tablewrap"><table><thead><tr><th>Asset</th><th class="n">Rate</th><th class="n">Opening WDV</th><th class="n">Additions</th><th class="n">Already posted</th><th class="n">Post now (₹)</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="postDep()">Post depreciation entries dated ${fy.endLabel}</button></div>
  </div>
  <div class="card"><h2>Other year-end entries (use New Entry → Journal)</h2><ul class="help">
    <li><b>FD interest credited/accrued:</b> Dr <i>FDR with NKGSB</i> (or <i>Accrued Interest on FDR</i> if not yet credited) / Cr <i>Interest on Fixed Deposits</i>.</li>
    <li><b>TDS deducted by bank on FD interest:</b> Dr <i>TDS Receivables</i> / Cr <i>Interest on Fixed Deposits</i> (gross interest = net credited + TDS).</li>
    <li><b>Last year's accrued interest ₹16,244 when the bank credits it:</b> Dr <i>FDR with NKGSB</i> / Cr <i>Accrued Interest on FDR</i> for that part only – it was already income in 2025-26.</li>
    <li><b>Expenses due but unpaid on 31 March (e.g. audit fees):</b> Dr <i>Audit Fees</i> / Cr <i>Liabilities – For Expenses</i>. Next year, pay it as a Payment against <i>Liabilities – For Expenses</i>, not as Audit Fees again.</li>
  </ul></div>`;
}
function postDep(){
  const fy = periodFor(selFY); let n = 0;
  document.querySelectorAll('input.dep').forEach(inp => {
    const amt = P(inp.value || 0); if (amt <= 0) return;
    const a = acc(inp.dataset.id);
    S.txns.push({id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), created: Date.now()+n, kind:'journal',
      vno: nextVoucher('journal', fy.to), date: fy.to, dr:'exp_dep', cr:a.id, amount:amt, party:'', ref:'',
      narration:`Depreciation on ${a.name}${a.depRate?` @${a.depRate}%`:''} for FY ${fy.label}`});
    n++;
  });
  if (!n) return alert('Nothing to post.');
  save(); alert(`Posted ${n} depreciation entries.`); render();
}

/* ------------------------------ Settings / backup ------------------------------ */
function settings(){
  const bal = S.accounts.filter(a => a.type!=='income' && a.type!=='expense');
  const dr = bal.filter(debitNature).reduce((s,a)=>s+a.opening,0), cr = bal.filter(a=>!debitNature(a)).reduce((s,a)=>s+a.opening,0);
  const typeOpts = Object.entries(TYPE_LABEL).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  return `<div class="card"><h2>Backup & restore</h2>
    <p class="muted">Everything is stored only in this browser on this device. Clearing browser data or losing the phone loses the books. Download a backup after every few entries and keep a copy in Google Drive / email.</p>
    <div class="row"><button class="btn" onclick="exportJSON()">Download backup (.json)</button>
      <label class="btn ghost" style="flex-direction:row;color:var(--accent)">Restore from backup<input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"></label>
      <button class="btn ghost" onclick="exportCSV()">Export all transactions (CSV for CA)</button>
      <button class="btn danger" onclick="resetAll()">Reset everything</button></div>
    <p class="muted">Last backup: ${S.lastBackup ? new Date(S.lastBackup).toLocaleString('en-IN') : 'never'}</p></div>

  <div class="card"><h2>Add a new head</h2>
    <form class="form" onsubmit="addHead(event)">
      <label>Name<input id="h_name" required placeholder="e.g. Membership Fees"></label>
      <label>Type<select id="h_type" onchange="document.getElementById('h_group').innerHTML=GROUPS[this.value].map(g=>'<option>'+g+'</option>').join('')">${typeOpts}</select></label>
      <label>Group (statement line)<select id="h_group">${GROUPS.fund.map(g=>`<option>${g}</option>`).join('')}</select></label>
      <label>Depreciation % (fixed assets only)<input id="h_dep" type="number" step="0.01" min="0"></label>
      <div><button class="btn" type="submit">Add head</button></div>
    </form></div>

  <div class="card"><h2>Opening balances as on ${dmy(prevDay(S.org.openingDate))}</h2>
    <p class="muted">Pre-filled from the audited Balance Sheet (Malvika & Associates, dated 22-08-2026). Home Theatre is ₹106 (142 − 36 depreciation); the printed ₹107 is a ₹1 rounding slip which made the printed asset side add to ₹11,92,724.</p>
    <div class="tablewrap"><table><thead><tr><th>Head</th><th>Type</th><th>Group</th><th class="n">Opening (₹)</th><th></th></tr></thead><tbody>
    ${S.accounts.map(a => `<tr><td><input value="${esc(a.name)}" onchange="renameHead('${a.id}',this.value)"></td><td>${TYPE_LABEL[a.type]}</td><td class="muted">${esc(a.group)}${a.depRate?` · ${a.depRate}%`:''}</td>
      <td class="n">${a.type==='income'||a.type==='expense'?'<span class="muted">–</span>':`<input type="number" step="0.01" value="${a.opening/100}" style="max-width:130px;text-align:right" onchange="setOpening('${a.id}',this.value)">`}</td>
      <td>${a.system||S.txns.some(t=>t.dr===a.id||t.cr===a.id)?'':`<button class="btn danger sm" onclick="delHead('${a.id}')">Remove</button>`}</td></tr>`).join('')}
    <tr class="tot"><td colspan="3">Assets ₹ ${fmt(dr)} vs Funds & Liabilities ₹ ${fmt(cr)}</td><td class="n">${dr===cr?'<span class="ok">Tallies</span>':`<span class="bad">Diff ${fmt(dr-cr)}</span>`}</td><td></td></tr>
    </tbody></table></div></div>`;
}
function addHead(ev){
  ev.preventDefault();
  const name = $('#h_name').value.trim(), type = $('#h_type').value, group = $('#h_group').value, dep = parseFloat($('#h_dep').value);
  if (!name) return;
  const id = type.slice(0,3) + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,20) + '_' + Date.now().toString(36).slice(-4);
  const a = {id, name, type, group, opening:0};
  if (group === 'Fixed Assets' && dep > 0) a.depRate = dep;
  S.accounts.push(a); save(); render();
}
function renameHead(id, v){ if (v.trim()){ acc(id).name = v.trim(); save(); } }
function setOpening(id, v){ acc(id).opening = P(v || 0); save(); render(); }
function delHead(id){ if (confirm(`Remove head "${accName(id)}"?`)){ S.accounts = S.accounts.filter(a => a.id !== id); save(); render(); } }
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportJSON(){
  S.lastBackup = Date.now(); save();
  download(`odakkuzhal-books-${today()}.json`, JSON.stringify(S, null, 1), 'application/json');
  render();
}
function importJSON(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.accounts) || !Array.isArray(d.txns)) throw new Error('not a backup file');
      if (!confirm(`Replace current books with backup containing ${d.txns.length} entries?`)) return;
      S = d; save(); render(); alert('Restored.');
    } catch(e){ alert('Could not read backup: ' + e.message); }
  };
  r.readAsText(file);
}
function exportCSV(){
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = [['Date','Voucher','Type','Debit head','Credit head','Amount','Party','Ref','Narration']];
  sortedTxns().forEach(t => rows.push([dmy(t.date), t.vno, t.kind, accName(t.dr), accName(t.cr), (t.amount/100).toFixed(2), t.party, t.ref, t.narration]));
  download(`odakkuzhal-transactions-${today()}.csv`, rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}
function resetAll(){
  if (!confirm('This deletes ALL entries and restores the audited opening balances. Download a backup first. Continue?')) return;
  if (prompt('Type DELETE to confirm') !== 'DELETE') return;
  S = defaultState(); save(); render();
}

/* ------------------------------ help ------------------------------ */

  const r = (what, how) => `<tr><td>${what}</td><td>${how}</td></tr>`;
  return `<div class="card"><h2>How to record common transactions</h2>
  <div class="tablewrap"><table><thead><tr><th>What happened</th><th>Record as</th></tr></thead><tbody>
  ${r('Donation / contribution received in cash','Receipt → Cash → <i>Donation in Bank or Kind</i>')}
  ${r('Donation received by UPI / cheque / NEFT','Receipt → Bank → <i>Donation in Bank or Kind</i>')}
  ${r('Corpus donation (donor says it is for corpus)','Receipt → <i>Trust Funds or Corpus</i> (not income)')}
  ${r('Donation earmarked for the building','Receipt → <i>Building Fund</i>')}
  ${r('Deposit taken (refundable, e.g. hall booking)','Receipt → <i>Liabilities – For Deposits</i>; refund it as a Payment against the same head')}
  ${r('You deposit cash in NKGSB','Cash ⇄ Bank → Deposit cash into bank')}
  ${r('You withdraw cash from NKGSB','Cash ⇄ Bank → Withdraw cash from bank')}
  ${r('Electricity / water / society (Sai Nagar CHS) bill','Payment → <i>Electricity Charges</i> / <i>Water Charges</i> / <i>Sai Nagar CHS Ltd</i>')}
  ${r('Onam / AGM / programme expenses','Payment → <i>Misc Expenditure (AGM)</i> or <i>Project Operation Expenses</i>')}
  ${r('Charity / help given to a person','Payment → <i>Other Charitable Objects</i>')}
  ${r('Audit fee ₹6,490 for 2025-26 (already provided last year)','Payment → <i>Liabilities – For Expenses</i>. Do <b>not</b> use Audit Fees, or it is counted twice.')}
  ${r('Bank charges debited in passbook','Payment → Bank → <i>Bank Charges</i>')}
  ${r('SB interest credited in passbook','Receipt → Bank → <i>Interest on Savings Bank Account</i>')}
  ${r('Income-tax refund received','Receipt → Bank → <i>TDS Receivables</i> (tax part) and a second Receipt → <i>Interest on Income Tax Refund</i> (interest part)')}
  ${r('Buying an AC / furniture / instrument','Payment → the fixed-asset head (not an expense)')}
  ${r('New FD made from bank / FD matured into bank','Payment → <i>FDR with NKGSB</i> / Receipt → <i>FDR with NKGSB</i>')}
  ${r('Interest added to FD, TDS, depreciation','Journal – see Year-end tab')}
  </tbody></table></div>
  <h3>Good habits</h3><ul class="help">
    <li>Write a voucher number (shown after saving) on every bill and receipt and file them in order.</li>
    <li>Every month: Bank Book closing must equal the passbook; Cash Book closing must equal cash physically with you.</li>
    <li>Do not mix personal money with Samajam cash. If you pay from your own pocket, record it only when reimbursed, or record a Receipt from yourself first.</li>
    <li>Download a backup regularly (Heads & Backup tab).</li>
  </ul></div>`;
}

load(); render();
</script>
